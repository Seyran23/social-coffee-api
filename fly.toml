app = "social-coffee-api"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs once, on a fresh machine, before the new release's machines start
  # taking traffic. Non-zero exit aborts the whole deploy — old machines keep
  # serving, new code never goes live against a mismatched schema.
  release_command = "npx prisma migrate deploy"

[env]
  NODE_ENV = "production"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
